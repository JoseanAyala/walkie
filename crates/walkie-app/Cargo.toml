[package]
name = "walkie-app"
version = "0.7.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
walkie-core = { path = "../walkie-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# `macos-private-api` must only be on for macOS: tauri-build checks the
# feature set against `tauri.conf.json`'s merged `app.macOSPrivateApi`
# (set in tauri.macos.conf.json), which is only true on that platform.
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same clipboard crate, same feature as walkie-core — see
# `walkie_core::inject::PasteInjector`'s doc.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[features]
# Lets the OS e2e suite swap the mic for a WAV (WALKIE_TEST_AUDIO). Never on
# in shipped builds; e2e/run-app-tests.sh turns it on.
test-hooks = []
# Tests against Apple's real on-device model (`make test-ai`).
ai-tests = []

[dev-dependencies]
image = "0.25"

[[bin]]
name = "walkie"
path = "src/main.rs"
