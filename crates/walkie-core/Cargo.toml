[package]
name = "walkie-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6.1"
cpal = "0.18.2"
enigo = "0.6.1"
hound = "3.5.1"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
ureq = "2"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[features]
stt-tests = []

[dev-dependencies]
tempfile = "3.27.0"
