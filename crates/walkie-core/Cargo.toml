[package]
name = "walkie-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6.1"
cpal = "0.18.2"
enigo = "0.6.1"
hound = "3.5.1"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16.0"

[target.'cfg(target_os = "linux")'.dependencies]
# The keyboard hook reads /dev/input directly (works on Wayland and X11).
evdev = "0.13.2"
# zwp_virtual_keyboard_v1, which Hyprland (and other wlroots compositors)
# support; enigo still also builds its default x11rb backend for plain X11
# sessions — see `inject::disable_x11_fallback` for why only one of the two
# ends up actually talking to anything at runtime.
enigo = { version = "0.6.1", features = ["wayland"] }
# wl-clipboard-rs's data-control protocol; see `inject::PasteInjector`'s
# doc for how its background-serving default interacts with the paste
# sequence.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[features]
stt-tests = []

[dev-dependencies]
tempfile = "3.27.0"
