[package]
name = "hearme-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hearme-core = { path = "../hearme-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rdev = "0.5.3"
libc = "0.2"

[dev-dependencies]
image = "0.25"

[[bin]]
name = "hearme"
path = "src/main.rs"
