<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css"><style>
  /* a dark color-scheme would paint an opaque canvas behind the pill */
  html, body { background: transparent; overflow: hidden; color-scheme: normal !important }
  #pill { display: flex; align-items: center; gap: 8px; height: 40px; margin: 9px 13px 15px 9px;
          padding: 0 8px; background: var(--panel); border: 2px solid var(--line);
          box-shadow: 4px 4px 0 var(--line) }
  #chip { flex: none; min-width: 44px; text-align: center; background: var(--accent);
          color: var(--accent-fg) }
  #chip::before { content: "■ "; animation: blink 1s steps(1) infinite }
  .busy #chip { background: var(--chip); color: var(--chip-fg) }
  .busy #chip::before, .notice #chip::before, .error #chip::before { content: none }
  .notice #chip { background: var(--tag); color: var(--fg) }
  .error #chip { background: var(--warn); color: var(--accent-fg) }
  #label { flex: 1; min-width: 0; line-height: 14px; overflow: hidden; display: -webkit-box;
           -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere }
  /* a pixel VU meter: blocks light up left to right with the input level */
  #bars { display: flex; gap: 2px; flex: none }
  #bars i { width: 5px; height: 12px; background: var(--tag); display: block }
  #bars i.on { background: var(--fg) }
  #bars i.on.hot { background: var(--accent) }
  .busy #bars, .notice #bars, .error #bars { display: none }
</style></head><body>
<div id="pill">
  <span id="chip">REC</span><span id="label">listening…</span>
  <span id="bars"></span>
</div>
<script>
  const { listen } = window.__TAURI__.event;
  const $ = id => document.getElementById(id);
  const pill = $('pill'), label = $('label'), chip = $('chip');
  const N = 10;
  for (let i = 0; i < N; i++) $('bars').appendChild(document.createElement('i'));
  const bars = [...document.querySelectorAll('#bars i')];
  bars.slice(-2).forEach(b => b.classList.add('hot'));

  const names = { recording: 'listening…', transcribing: 'transcribing…',
                  polishing: 'polishing…', injecting: 'typing…' };
  const SPIN = ['▖', '▘', '▝', '▗'];
  let spin = 0, spinner;
  function mode(m, chipText) {
    pill.classList.remove('busy', 'notice', 'error');
    if (m) pill.classList.add(m);
    chip.textContent = chipText;
    clearInterval(spinner);
    if (m === 'busy') spinner = setInterval(() => chip.textContent = SPIN[spin++ % 4] + ' BUSY', 150);
  }
  listen('state', e => {
    if (e.payload === 'recording') mode(null, 'REC'); else mode('busy', '▖ BUSY');
    label.textContent = names[e.payload] || e.payload;
  });
  // Lit blocks fall back one at a time, so the meter reads as a level
  // instead of flickering with every audio buffer.
  let lit = 0;
  listen('level', e => {
    const want = Math.round(Math.min(1, e.payload * 8) * N);
    lit = Math.max(want, lit - 1);
    bars.forEach((b, i) => b.classList.toggle('on', i < lit));
  });
  listen('app-error', e => { mode('error', 'ERR'); label.textContent = e.payload; });
  // Informational, not a failure.
  listen('app-notice', e => { mode('notice', 'NOTE'); label.textContent = e.payload; });
</script></body></html>
