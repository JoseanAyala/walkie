[package]
name = "hearme-e2e"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end tests: key events → hotkey engine → session → real Whisper → injected text"

[dependencies]
hearme-core = { path = "../crates/hearme-core" }
anyhow = "1"

[features]
# Drives the installed /Applications/hearme.app through macOS: real key
# events, the tray, the windows, TextEdit. Run via e2e/run-app-tests.sh.
os-tests = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication", "NSMenu", "NSMenuItem", "NSWindow", "NSText", "NSTextView",
    "NSView", "NSResponder", "NSEvent", "NSGraphics", "NSRunningApplication",
] }

# The window the OS e2e suite dictates into (see src/bin/typing-target.rs).
[[bin]]
name = "typing-target"
required-features = ["os-tests"]
