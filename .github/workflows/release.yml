name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches tauri.conf.json version
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' crates/hearme-app/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Unit tests
        run: cargo test
      - name: Build hearme.app
        id: package
        run: echo "zip=$(scripts/package.sh | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "hearme $GITHUB_REF_NAME" --generate-notes \
            --notes "Ad-hoc signed: on first launch, right-click hearme.app → Open."
