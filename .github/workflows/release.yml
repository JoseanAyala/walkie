name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches tauri.conf.json version
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' crates/walkie-app/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: make check
      - name: Build Walkie.app
        run: make package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/bundle/walkie-*.zip \
            --title "Walkie $GITHUB_REF_NAME" --generate-notes \
            --notes "Ad-hoc signed: on first launch, right-click Walkie.app → Open."
