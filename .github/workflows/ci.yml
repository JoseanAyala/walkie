name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint and unit tests share one job: macOS minutes are billed at 10x, and
  # a second job would pay for its own checkout, cache restore and compile.
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: make fmt-check
      - name: Clippy
        run: make lint
      # default-members only: the e2e crate needs the Whisper model and,
      # for the app suite, macOS permissions a hosted runner can't grant.
      - name: Unit tests
        run: make test

  build:
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Build hearme.app
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: hearme-${{ github.sha }}
          path: target/release/bundle/hearme-*.zip
          if-no-files-found: error
          retention-days: 14
