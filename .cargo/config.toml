# Xcode Command Line Tools on this class of macOS setup doesn't expose
# libiconv on the default linker search path, which breaks any crate graph
# that pulls in a transitive dependency needing it (e.g. tempfile -> rustix).
# Point the linker at Homebrew's copy instead of requiring every shell to
# export RUSTFLAGS by hand. Safe for any macOS build (Homebrew's libiconv is
# additive), never applies on other platforms.
[target.'cfg(target_os = "macos")']
rustflags = ["-L", "/opt/homebrew/opt/libiconv/lib"]

# rustc's final-link step shells out to a linker named "cc". On a plain Mac
# that's Apple clang and this is a no-op; it only matters on machines where
# something else (e.g. a Nix profile) shadows "cc" on PATH with a compiler
# that can't find Apple's libc++. Pinning it here is correct for every
# aarch64-apple-darwin build regardless of that — it's scoped to the literal
# target triple, so it never applies to a Linux or Windows build.
[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"

# NOTE: an earlier revision of this file also pinned CC/CXX via [env] to
# work around the same Nix-shadowing issue for build-script compilation
# (e.g. whisper-rs-sys). That was reverted: Cargo's [env] table has no
# per-target/cfg scoping (confirmed empirically — a build script sees
# Err(NotPresent) under a [target.'cfg(...)'.env] table), so committing it
# here would break every non-macOS build of any crate that needs a C
# compiler. If your `cc`/`c++` resolve to something that can't build
# Objective-C (same symptom: whisper-rs-sys fails to compile), add
# [env] CC/CXX to your own ~/.cargo/config.toml instead — that's a
# machine-local fact, not a project one.
