# TODO: this file exists mostly because of one root cause — this machine's
# Nix profile sits ahead of /usr/bin and Homebrew on PATH, so `cc`/`c++`
# resolve to a Nix GCC wrapper instead of Apple clang. Fix the PATH ordering
# (put /usr/bin and /opt/homebrew/bin ahead of ~/.nix-profile/bin, or keep
# Nix's C toolchain out of the default profile) and most of the pins below
# become unnecessary. Left as-is for now since they're harmless on machines
# without this conflict.

# Xcode Command Line Tools on this class of macOS setup doesn't expose
# libiconv on the default linker search path, which breaks any crate graph
# that pulls in a transitive dependency needing it (e.g. tempfile -> rustix).
# Point the linker at Homebrew's copy instead of requiring every shell to
# export RUSTFLAGS by hand.
[target.'cfg(target_os = "macos")']
rustflags = ["-L", "/opt/homebrew/opt/libiconv/lib"]

# This dev machine has a Nix profile ahead of /usr/bin on PATH, and its
# `cc`/`c++` resolve to a GCC wrapper rather than Apple clang. GCC can't
# compile whisper.cpp's Objective-C Metal backend (`@available`,
# `@autoreleasepool` are clang extensions), so C/C++ build scripts (cc-rs,
# cmake-rs) need to be pointed at the real Apple clang explicitly.
[env]
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"

# rustc's own final-link step also shells out to a linker named "cc", which
# resolves to the same Nix GCC wrapper via PATH. That gcc doesn't know how to
# find Apple's libc++ (needed once whisper-rs links C++ code), so pin rustc's
# linker to Apple clang too. `linker` is only settable per literal target
# triple (not a cfg() table), hence this is scoped to the arm64 Mac triple.
[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"
